name: Continuos Integration and Delivery with GitHub Actions

on:
  push:
    branches:
      - "main"
jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_ACCESS_TOKEN }}

      - name: Setup Java 21
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build Application .jar
        working-directory: ./
        run: mvn clean package

      - name: Docker Compose Build
        working-directory: ./
        run: docker compose build

      - name: Push To Docker Hub Container Registry
        run: |
          docker tag ${{ secrets.DOCKER_USERNAME }}/java-spring-rest-api:latest ${{ secrets.DOCKER_USERNAME }}/java-spring-rest-api:${{ github.run_id }}
          
          docker push ${{ secrets.DOCKER_USERNAME }}/java-spring-rest-api:latest
          docker push ${{ secrets.DOCKER_USERNAME }}/java-spring-rest-api:${{ github.run_id }}
