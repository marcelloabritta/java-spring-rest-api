services:
  db:
    image: mysql:9.1.0
    environment:
      TZ: America/Sao_Paulo
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: java_spring_rest_api
    ports:
      - "3308:3306"
    expose:
      - 3306
    networks:
      - marcello-network
  api:
    image: marcelloabritta/java-spring-rest-api
    build: .
    environment:
      TZ: America/Sao_Paulo
      SPRING_DATASOURCE_URL: jdbc:mysql://db:3306/java_spring_rest_api?useTimezone=true&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: ${DB_USER}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      EMAIL_USERNAME: ${EMAIL_USERNAME}
      EMAIL_PASSWORD: ${EMAIL_PASSWORD}
    ports:
      - "80:80"
    depends_on:
      - db
    networks:
      - marcello-network
networks:
  marcello-network:
    driver: bridge